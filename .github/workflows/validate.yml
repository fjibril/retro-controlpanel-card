name: Validate

# HACS repository validation - the same checks HACS runs on the default-store
# submission. Must pass with no ignored checks before submitting to hacs/default.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "plugin"
